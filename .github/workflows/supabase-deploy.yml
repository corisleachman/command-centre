name: Supabase validate and deploy

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Validate connection or deploy migrations and functions
        required: true
        default: validate
        type: choice
        options:
          - validate
          - deploy

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Validate connection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'validate' }}
        run: supabase migration list

      - name: Apply pending migrations
        if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --include-all

      - name: Deploy Edge Functions
        if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d supabase/functions ]; then
            for function_dir in supabase/functions/*; do
              [ -d "$function_dir" ] || continue
              function_name="$(basename "$function_dir")"
              supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
            done
          fi
