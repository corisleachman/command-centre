name: Supabase validate and deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Validate connection or deploy migrations and functions
        required: true
        default: validate
        type: choice
        options:
          - validate
          - deploy

permissions:
  contents: read

jobs:
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Validate connection
        if: ${{ inputs.action == 'validate' }}
        run: supabase migration list

      - name: Apply foundation migration first
        if: ${{ inputs.action == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          DATA_MIGRATION="supabase/migrations/20260803_migrate_legacy_command_centre_state.sql"
          TEMP_MIGRATION="/tmp/20260803_migrate_legacy_command_centre_state.sql"

          if [ -f "$DATA_MIGRATION" ]; then
            mv "$DATA_MIGRATION" "$TEMP_MIGRATION"
          fi

          supabase db push --include-all

          if [ -f "$TEMP_MIGRATION" ]; then
            mv "$TEMP_MIGRATION" "supabase/migrations/20260804_migrate_legacy_command_centre_state.sql"
          fi

          supabase db push --include-all

      - name: Deploy Edge Functions
        if: ${{ inputs.action == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d supabase/functions ]; then
            for function_dir in supabase/functions/*; do
              [ -d "$function_dir" ] || continue
              function_name="$(basename "$function_dir")"
              supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
            done
          fi
