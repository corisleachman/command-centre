name: Supabase validate and deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Choose whether to validate or deploy
        required: true
        default: validate
        type: choice
        options:
          - validate
          - deploy

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  supabase:
    name: ${{ inputs.operation == 'deploy' && 'Deploy Supabase changes' || 'Validate Supabase access' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.operation == 'deploy' && 'supabase-production' || '' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets exist
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for variable in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect linked project
        if: inputs.operation == 'validate'
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list
          echo "Supabase authentication and project linking succeeded."
          echo "No migrations or Edge Functions were deployed."

      - name: Apply database migrations
        if: inputs.operation == 'deploy'
        run: supabase db push --include-all

      - name: Deploy Edge Functions
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d supabase/functions ]; then
            for function_dir in supabase/functions/*; do
              [ -d "$function_dir" ] || continue
              function_name="$(basename "$function_dir")"
              echo "Deploying Edge Function: $function_name"
              supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID"
            done
          fi
